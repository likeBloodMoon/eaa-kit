name: eaa-kit accessibility audit
description: >-
  Build a static site, audit the built HTML against WCAG 2.2 AA with eaa-kit,
  and upload the results to GitHub code scanning as SARIF.
author: eaa-kit

branding:
  icon: check-circle
  color: blue

inputs:
  directory:
    description: >-
      Directory holding the built site, relative to working-directory. Leave
      empty to let eaa-kit work it out from the project, which is what it does
      on the command line.
    required: false
    default: ./dist
  url:
    description: >-
      Audit a running site instead of a directory, for example
      http://localhost:3000. Start the server in an earlier step. This is the
      only way to audit a site that renders on a server and never writes HTML —
      a Next.js app with API routes or middleware, Nuxt, SvelteKit. Takes
      precedence over "directory".
    required: false
    default: ''
  allow-remote:
    description: >-
      Allow "url" to point at a host that is not localhost. Off by default: a
      workflow should not be one input away from crawling production.
    required: false
    default: 'false'
  sitemap:
    description: >-
      Where the site lists its own pages, when that is not /sitemap.xml. A CMS
      rarely puts it there: WordPress with Yoast serves /sitemap_index.xml, and
      TYPO3 and Craft put it behind a route of their own. Only used with "url";
      link following alone finds only what the navigation links to.
    required: false
    default: ''
  max-pages:
    description: Stop the crawl after this many pages.
    required: false
    default: ''
  build-command:
    description: >-
      Command that produces the build, for example "npm run build". Leave empty
      when the site is built by an earlier step.
    required: false
    default: ''
  install-command:
    description: Dependency install command, run before build-command.
    required: false
    default: ''
  working-directory:
    description: Directory to run the install, build and audit from.
    required: false
    default: '.'
  fail-on:
    description: 'Lowest impact that fails the run: minor, moderate, serious, critical.'
    required: false
    default: serious
  base-url:
    description: Audit pages under their real site URL instead of file://.
    required: false
    default: ''
  sarif-file:
    description: Where to write the SARIF log.
    required: false
    default: eaa-kit.sarif
  upload-sarif:
    description: Upload the SARIF log to GitHub code scanning.
    required: false
    default: 'true'
  baseline:
    description: 'Path to an eaa-kit baseline file. Violations it lists do not fail the run.'
    required: false
    default: ''

  concurrency:
    description: 'Worker threads the browserless engine may use, or 1 for none. Default: from the page and core count.'
    required: false
    default: ''

  version:
    description: Version of eaa-kit to run, as an npm dist-tag or version.
    required: false
    default: latest

outputs:
  sarif-file:
    description: Path to the SARIF log that was written.
    value: ${{ inputs.sarif-file }}
  exit-code:
    description: 'Exit code from the audit: 0 clean, 1 violations, 2 could not run.'
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      if: inputs.install-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}

    - name: Build site
      if: inputs.build-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    # The audit's exit code is captured rather than allowed to end the job, so
    # the SARIF upload below still runs when violations are found. The job is
    # failed at the end instead, once the alerts are in place.
    - name: Run eaa-kit audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EAA_DIRECTORY: ${{ inputs.directory }}
        EAA_URL: ${{ inputs.url }}
        EAA_ALLOW_REMOTE: ${{ inputs.allow-remote }}
        EAA_SITEMAP: ${{ inputs.sitemap }}
        EAA_MAX_PAGES: ${{ inputs.max-pages }}
        EAA_FAIL_ON: ${{ inputs.fail-on }}
        EAA_SARIF: ${{ inputs.sarif-file }}
        EAA_BASE_URL: ${{ inputs.base-url }}
        EAA_VERSION: ${{ inputs.version }}
        EAA_CONCURRENCY: ${{ inputs.concurrency }}
        EAA_BASELINE: ${{ inputs.baseline }}
      run: |
        set -o pipefail
        # A URL replaces the directory rather than joining it: they are two
        # sources for the same run, and passing both would leave the tool to
        # guess which the workflow meant.
        if [ -n "$EAA_URL" ]; then
          args=(--url "$EAA_URL")
          if [ "$EAA_ALLOW_REMOTE" = "true" ]; then
            args+=(--allow-remote)
          fi
          if [ -n "$EAA_SITEMAP" ]; then
            args+=(--sitemap "$EAA_SITEMAP")
          fi
          if [ -n "$EAA_MAX_PAGES" ]; then
            args+=(--max-pages "$EAA_MAX_PAGES")
          fi
        elif [ -n "$EAA_DIRECTORY" ]; then
          args=("$EAA_DIRECTORY")
        else
          # Neither given: let eaa-kit work the project out, as it does on the
          # command line.
          args=()
        fi
        args+=(--format sarif --output "$EAA_SARIF" --fail-on "$EAA_FAIL_ON")
        if [ -n "$EAA_BASE_URL" ]; then
          args+=(--base-url "$EAA_BASE_URL")
        fi
        if [ -n "$EAA_CONCURRENCY" ]; then
          args+=(--concurrency "$EAA_CONCURRENCY")
        fi
        if [ -n "$EAA_BASELINE" ]; then
          args+=(--baseline "$EAA_BASELINE")
        fi

        set +e
        npx --yes "eaa-kit@${EAA_VERSION}" audit "${args[@]}"
        code=$?
        set -e

        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 2 ]; then
          echo "::error::eaa-kit could not complete the audit (exit 2)."
        fi

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true' && steps.audit.outputs.exit-code != '2'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        category: eaa-kit

    # Exit 2 means the audit never produced a verdict, which is a broken run
    # rather than a failing one. Both fail the job, but only after the alerts
    # from a normal failing run have been uploaded.
    - name: Fail on findings
      if: steps.audit.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "eaa-kit exited with ${{ steps.audit.outputs.exit-code }}"
        exit 1
