name: Release

# Publishes to npm when a v* tag is pushed:
#   pnpm version 0.1.0 --no-git-tag-version   # already done in package.json
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance: the workflow exchanges this for a Sigstore
      # signing identity. Provenance also requires the repository to be public.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Browser mode is covered by the test suite, so the runner needs the
      # binary. Playwright itself is a devDependency; the browser is not.
      - run: npx playwright install --with-deps chromium

      # The published artefact is the built one, so it gets the same checks the
      # rest of CI runs before it goes out.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

      # The tag against package.json, the dated changelog, the Action pins
      # and the examples. CI already ran this on the release PR; running it
      # again here covers a tag pushed by hand onto some other commit.
      - name: Check this commit is ready to publish as this tag
        run: pnpm release:check "$GITHUB_REF_NAME"

      # access and provenance come from publishConfig in package.json, so a
      # manual publish behaves the same way.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
