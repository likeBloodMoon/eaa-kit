name: Release

# Publishes to npm when a v* tag is pushed:
#   pnpm version 0.1.0 --no-git-tag-version   # already done in package.json
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance: the workflow exchanges this for a Sigstore
      # signing identity. Provenance also requires the repository to be public.
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          # No registry-url. It makes setup-node write an .npmrc line reading
          # _authToken=${NODE_AUTH_TOKEN}, which with no token set is an empty
          # credential that npm takes as configured, so it never tries the
          # trusted-publisher login and the staging fails. The default
          # registry is npmjs.org anyway.

      - run: pnpm install --frozen-lockfile

      # Browser mode is covered by the test suite, so the runner needs the
      # binary. Playwright itself is a devDependency; the browser is not.
      - run: npx playwright install --with-deps chromium

      # The published artefact is the built one, so it gets the same checks the
      # rest of CI runs before it goes out.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

      # The tag against package.json, the dated changelog, the Action pins
      # and the examples. CI already ran this on the release PR; running it
      # again here covers a tag pushed by hand onto some other commit.
      - name: Check this commit is ready to publish as this tag
        run: pnpm release:check "$GITHUB_REF_NAME"

      # npm 11.5.1 or later, for trusted publishing and `npm stage`. Node 22
      # ships npm 10, which has neither.
      - run: npm install --global npm@11

      # Staged, not published. This workflow authenticates as a trusted
      # publisher (OIDC, through the id-token permission above; no token is
      # stored anywhere), and npmjs.com lets that publisher stage only. The
      # version goes live when a maintainer approves it on npmjs.com, or with
      # `npm stage approve <id>`, either of which asks for 2FA: a compromised
      # workflow or a stolen GitHub token can upload, but cannot release.
      #
      # access and provenance come from publishConfig in package.json.
      - run: npm stage publish
